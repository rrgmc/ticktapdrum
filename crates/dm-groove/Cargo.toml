[package]
name = "dm-groove"
description = "TickTapDrum's import of MIDI groove packs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dm-project = { workspace = true }
midly = { version = "0.5", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { workspace = true }
# The same TLS setup as dm-bank: rustls with the ring provider and the bundled Mozilla roots. It
# needs no platform certificate store, so it behaves the same on every platform.
ureq = { version = "3", default-features = false, features = ["rustls"] }
