[package]
name = "dm-desktop"
description = "TickTapDrum on Windows, macOS and Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ticktapdrum"
path = "src/main.rs"

[features]
default = ["midi"]
# MIDI out. `--no-default-features` builds the app without it.
midi = ["dm-ui/midi"]

[dependencies]
dm-ui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "clipboard", "links", "wayland", "x11"] }
log = { workspace = true }

# The icon of the Windows executable (build.rs).
[build-dependencies]
winresource = "0.1"
