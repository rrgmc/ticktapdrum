# Builds TickTapDrum for every system and publishes a GitHub release, only when a version tag
# is pushed:
#   git tag v0.2.0
#   git push origin v0.2.0
# Nothing runs on ordinary pushes. The tag must match the workspace version in Cargo.toml (v0.2.0
# needs version = "0.2.0"), so bump that in a commit first. A tag with a suffix, such as
# v0.2.0-rc.1, is published as a pre-release. The release notes are the version's section of
# CHANGELOG.md; see changelog.d/README.md.
#
# What the release holds: see apps/dm-desktop/packaging/README.md and BUILDING.md.
#
# Secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    the Android release keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias
#   ANDROID_KEY_PASSWORD       the key's password; may be left unset when it is the same
#   MACOS_CERTIFICATE_P12      optional: the Developer ID Application certificate and key, a .p12
#                              file in base64
#   MACOS_CERTIFICATE_PASSWORD optional: that file's password
#   NOTARY_API_KEY             optional: an App Store Connect API key (.p8), as text or in base64
#   NOTARY_API_KEY_ID          optional: that key's ID
#   NOTARY_API_ISSUER          optional: that key's issuer ID
# Without the Android keystore the Android job fails rather than publish a debug-signed APK.
# Without the macOS certificate the Mac app is signed ad hoc; with the certificate but without the
# notary key it is signed but not notarized. The iOS app is always unsigned.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - name: The tag matches Cargo.toml
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::The tag says $VERSION but Cargo.toml says $CARGO_VERSION. Bump the workspace version first."
            exit 1
          fi
          # The build number must grow with each release: 1.2.3 becomes 10203. A pre-release
          # suffix does not count, so 1.2.3-rc.1 has the same number as 1.2.3.
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%[-+]*}"
          {
            echo "version=$VERSION"
            echo "code=$(( 10#${MAJOR:-0} * 10000 + 10#${MINOR:-0} * 100 + 10#${PATCH:-0} ))"
            case "$VERSION" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac
          } >> "$GITHUB_OUTPUT"

  desktop:
    name: Build (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-26
          - name: linux
            # The oldest supported Ubuntu, so the program runs on older systems too.
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Secrets cannot be tested in a step's `if`, so they are copied here first.
      HAS_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.NOTARY_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""

      - name: Linux build libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libdbus-1-dev pkg-config dpkg-dev

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          ./apps/dm-desktop/packaging/windows/package.ps1 $env:VERSION

      - name: Import the signing certificate (macOS)
        if: matrix.name == 'macos' && env.HAS_MACOS_CERT == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          # The identity's name, such as "Developer ID Application: Name (TEAMID)".
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          if [ -z "$IDENTITY" ]; then
            echo "::error::The certificate holds no Developer ID Application identity."
            exit 1
          fi
          echo "DM_MACOS_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Write the notary key (macOS)
        if: matrix.name == 'macos' && env.HAS_MACOS_CERT == 'true' && env.HAS_NOTARY_KEY == 'true'
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          # The key may be stored as the .p8 file's text or as the file in base64.
          case "$NOTARY_API_KEY" in
            *"BEGIN PRIVATE KEY"*) printf '%s\n' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary.p8" ;;
            *) echo "$NOTARY_API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8" ;;
          esac
          {
            echo "DM_MACOS_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "DM_MACOS_NOTARY_KEY_ID=$NOTARY_API_KEY_ID"
            echo "DM_MACOS_NOTARY_ISSUER=$NOTARY_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: bash apps/dm-desktop/packaging/macos/package.sh "$VERSION"

      - name: Remove the keychain and key (macOS)
        if: always() && matrix.name == 'macos'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: bash apps/dm-desktop/packaging/linux/package.sh "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: ticktapdrum-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  android:
    name: Build (android)
    needs: version
    runs-on: ubuntu-latest
    env:
      # The NDK the local builds use; see BUILDING.md.
      NDK_VERSION: 28.2.13676358
      VERSION: ${{ needs.version.outputs.version }}
      DM_VERSION_NAME: ${{ needs.version.outputs.version }}
      DM_VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-linux-android,x86_64-linux-android
          rustflags: ""

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Signing key
        # A release must be signed with the release key, so a missing secret stops the job
        # rather than shipping a debug-signed APK. The key file lives only on the runner.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DM_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release APK
        env:
          DM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash tools/android/build.sh --apk-release
          mkdir -p dist
          cp ports/android/app/build/outputs/apk/release/app-release.apk "dist/ticktapdrum-$VERSION-android.apk"

      - name: Check the signature and version
        # Fails when the APK is signed with the debug key or carries the wrong version.
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APK="dist/ticktapdrum-$VERSION-android.apk"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee signer.txt
          ! grep -q "CN=Android Debug" signer.txt
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -1 | tee badging.txt
          grep -q "versionCode='$DM_VERSION_CODE' versionName='$VERSION'" badging.txt
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: ticktapdrum-android
          path: dist/*
          if-no-files-found: error

  ios:
    name: Build (ios)
    needs: version
    # main.m uses iOS 26 APIs, so the build needs Xcode 26 or newer.
    runs-on: macos-26
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-ios,aarch64-apple-ios-sim
          rustflags: ""

      - name: XcodeGen
        run: brew install xcodegen

      - name: Package
        # Unsigned: the IPA must be signed again, by a sideloading tool, before it installs.
        run: bash tools/ios/package.sh "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: ticktapdrum-ios
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [version, desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS.txt

      - name: Release notes
        # The version's section of CHANGELOG.md, or, for a pre-release tagged before the merge, the
        # entries in changelog.d/. See changelog.d/README.md.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          bash tools/changelog/changelog.sh notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::warning::Neither CHANGELOG.md nor changelog.d/ has anything for $VERSION; GitHub writes the notes from the pull requests instead."
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          # GitHub's generated notes, which list the pull requests, stand in when the changelog
          # has nothing for this version.
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            flags+=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            flags+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "TickTapDrum $GITHUB_REF_NAME" \
            "${flags[@]}"
